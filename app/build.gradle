plugins {
    id 'com.android.application'
}

// A release build overrides these on the command line, e.g.
// ./gradlew assembleDebug -PreleaseVersionName=1.2.0 -PreleaseVersionCode=42
// Local builds fall back to the versions checked in below.
def releaseVersionName = project.findProperty('releaseVersionName')?.toString()
def releaseVersionCode = project.findProperty('releaseVersionCode')?.toString()

android {
    namespace 'io.github.nezjusz.keymastertest'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.nezjusz.keymastertest'
        minSdk 23
        targetSdk 29
        versionCode releaseVersionCode ? releaseVersionCode.toInteger() : 5
        versionName releaseVersionName ?: '1.1.0'
    }
    lint {
        // targetSdk stays at 29 deliberately. Android 15 enforces edge-to-edge for apps
        // targeting API 35, and this UI has not been tested against that; raising it would
        // change behaviour on modern devices for a sideloaded diagnostic tool.
        disable 'ExpiredTargetSdkVersion'
        abortOnError true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
}
