name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and publish, for example 1.2.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # android-actions/setup-android is deliberately not used: v3 tries to install the legacy
      # "tools" package, which no longer exists, and fails the job. The hosted runner already
      # ships a full SDK, so this only makes sure the exact components this project needs are
      # present. sdkmanager is a no-op for anything already installed.
      - name: Ensure the Android SDK components are installed
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(ls -d "${ANDROID_HOME:-$HOME/Android/Sdk}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          fi
          if [ -z "$sdkmanager" ]; then
            echo "Could not locate sdkmanager; ANDROID_HOME=${ANDROID_HOME:-unset}" >&2
            exit 1
          fi
          echo "Using $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # Guards the version before it reaches the tag, so a typo cannot create a broken release.
      - name: Reject a version that cannot become a tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Version '$VERSION' is not a plain version such as 1.2.0" >&2
            exit 1
          fi
          echo "Publishing version $VERSION"

      # Verification only. This compiles the repository exactly as it stands and runs the unit
      # tests and lint. Nothing is produced for download, so a broken commit yields a red check
      # and no APK at all.
      - name: Verify the repository as it stands
        if: github.event_name != 'workflow_dispatch'
        run: ./gradlew --stacktrace test lint assembleDebug

      # A manual run runs the same checks, but stamps the requested version onto the APK.
      # versionCode is the workflow run number so every published build gets a unique,
      # increasing code without anyone having to remember to bump it.
      - name: Build the requested version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew --stacktrace \
            "-PreleaseVersionName=$VERSION" \
            "-PreleaseVersionCode=$VERSION_CODE" \
            test lint assembleDebug

      # Gradle always emits app-debug.apk. Rename it to the release name here so the file is
      # correct both in the run's artifacts and on the releases page.
      - name: Give the APK its release name
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          built="app/build/outputs/apk/debug/app-debug.apk"
          release_name="app/build/outputs/apk/debug/keymaster-hardware-test_v$VERSION.apk"
          mv "$built" "$release_name"
          echo "Named $release_name"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Attach the APK to the run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: keymaster-hardware-test-${{ inputs.version }}
          path: app/build/outputs/apk/debug/keymaster-hardware-test_*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh shells out to git to work out which repository it is publishing to, and
      # --generate-notes needs history to diff against the previous release, so this job needs a
      # full checkout even though it downloads the APK rather than building it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the APK built by the build job
        uses: actions/download-artifact@v4
        with:
          name: keymaster-hardware-test-${{ inputs.version }}
          path: apk

      # gh ships on the hosted runner, so this avoids depending on a third-party release action.
      # It fails if the tag already exists, which is deliberate: republishing a version should
      # be an explicit decision, not a side effect of re-running a workflow.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            "apk/keymaster-hardware-test_v$VERSION.apk"
